name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages via API
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # C12/M1 da auditoria: a matemática financeira duplicada (tool.html ×
      # lib/taxas.ts) é validada antes de qualquer deploy — divergência
      # silenciosa quebra o workflow em vez de gerar proposta errada.
      - name: Testes da matemática financeira
        run: node --test tests/*.test.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          # Domínio custom da ferramenta (GitHub Pages serve em app.selosales.com.br)
          echo "app.selosales.com.br" > _site/CNAME
          # Legal pages (required for Hotmart)
          cp termos.html _site/termos.html
          cp privacidade.html _site/privacidade.html
          # The authenticated tool — servido na raiz (app.selosales.com.br) e
          # também em /tool.html (compatibilidade com links antigos).
          # C12 da auditoria: minifica no deploy (~-24% bruto, ~-28% gzip);
          # se o minificador falhar, cai na cópia crua — o deploy não quebra.
          npx --yes html-minifier-terser@7 tool.html \
            --collapse-whitespace --conservative-collapse \
            --minify-js true --minify-css true --remove-comments \
            -o _site/index.html \
            && cp _site/index.html _site/tool.html \
            || { echo "minificação falhou — usando cópia crua"; cp tool.html _site/index.html; cp tool.html _site/tool.html; }
          # PWA: instalável e offline (service worker + manifest + ícones)
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest
          # supabase-js auto-hospedado (C8/M8: sem CDN de terceiro) +
          # fonte Geist (M24) — ambos precacheados pelo sw.js
          mkdir -p _site/vendor/fonts
          cp vendor/supabase-js-2.105.4.js _site/vendor/
          cp vendor/fonts/Geist-Variable.woff2 vendor/fonts/GEIST-LICENSE.txt _site/vendor/fonts/
          cp marketing/logo/selo/app-icon-192.png _site/app-icon-192.png
          cp marketing/logo/selo/app-icon-512.png _site/app-icon-512.png
          # Social share image (PNG exported from og-image.svg, if present)
          cp og-image.png _site/og-image.png 2>/dev/null || true
          cp og-image.svg _site/og-image.svg 2>/dev/null || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
